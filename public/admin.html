<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petugas Antrian - RSU Santa Elisabeth</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">
  <div id="fatalError" class="fatal-error hidden"></div>
  <div id="loginView" class="login-wrap hidden">
    <form id="loginForm" class="login-card">
      <h1 class="login-title">Login Petugas</h1>
      <p class="login-sub">RSU Santa Elisabeth - Pemanggil Antrian</p>
      <label class="field">
        <span>Email</span>
        <input type="email" id="loginEmail" required autocomplete="username">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </label>
      <p class="login-error" id="loginError"></p>
      <button type="submit" class="btn primary block" id="loginBtn">Masuk</button>
      <a class="login-back" href="/">Kembali ke layar Display</a>
    </form>
  </div>

  <div id="appView" class="app-wrap hidden">
    <header class="admin-header">
      <div>
        <h1>Halaman Petugas</h1>
        <p class="admin-header-sub" id="counterLabel">Pendaftaran</p>
      </div>
      <div class="admin-user">
        <span id="userEmail"></span>
        <button class="btn ghost" id="logoutBtn">Keluar</button>
      </div>
    </header>

    <section class="status-cards">
      <div class="status-card">
        <span class="status-label">Nomor Terakhir Dipanggil</span>
        <span class="status-value" id="statLast">-</span>
      </div>
      <div class="status-card">
        <span class="status-label">Nomor Berikutnya</span>
        <span class="status-value" id="statNext">-</span>
      </div>
      <div class="status-card">
        <span class="status-label">Total Panggilan Hari Ini</span>
        <span class="status-value" id="statTotal">-</span>
      </div>
    </section>

    <section class="action-grid">
      <button class="btn primary big" id="callNextBtn">Panggil Berikutnya</button>
      <button class="btn" id="recallBtn">Panggil Ulang</button>
      <button class="btn warn" id="skipBtn">Skip Nomor</button>
    </section>

    <section class="panel">
      <h2>Panggil Nomor Manual</h2>
      <div class="inline-form">
        <input type="text" id="manualNumber" placeholder="contoh: 15 atau A15" inputmode="numeric">
        <button class="btn" id="manualBtn">Panggil</button>
      </div>
    </section>

    <section class="panel">
      <h2>Panggil Berdasarkan Nama</h2>
      <div class="inline-form">
        <input type="text" id="nameInput" placeholder="ketik nama pasien" maxlength="100">
        <button class="btn" id="nameBtn">Panggil</button>
      </div>
    </section>

    <section class="panel">
      <h2>Riwayat Panggilan Hari Ini</h2>
      <ul class="log-list" id="logList"></ul>
    </section>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
